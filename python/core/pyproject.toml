[project]
name = "backpressure"
version = "0.1.0"
description = "Async, multi-tenant, multi-dimensional rate limiting backed by Valkey"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Stanislav Kosorin", email = "stanokosorin4@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "loguru==0.7.3",
    "pyyaml>=6.0",
    "valkey==6.1.1",
]

[project.urls]
Repository = "https://github.com/stano45/backpressure"
Documentation = "https://github.com/stano45/backpressure/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backpressure"]

[dependency-groups]
dev = [
    "basedpyright==1.39.0",
    "fakeredis[lua,valkey]==2.35.1",
    "httpx==0.28.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: reserved for live-stack tests"]
filterwarnings = [
    "ignore:Call to 'get_connection' function with deprecated usage:DeprecationWarning",
]
