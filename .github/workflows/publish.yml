name: Publish

on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install
        working-directory: python

      - name: Build backpressure
        run: uv build --package backpressure --out-dir dist
        working-directory: python

      - name: Build backpressure-temporal
        run: uv build --package backpressure-temporal --out-dir dist
        working-directory: python

      - name: Publish
        run: uv publish --trusted-publishing always
        working-directory: python
